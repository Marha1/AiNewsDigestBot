version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ainnewsbot_postgres
    environment:
      POSTGRES_DB: AiNewsbot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ainnewsbot_app
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=AiNewsbot;Username=postgres;Password=postgres
      - Telegram__Token=${TELEGRAM_TOKEN}
      - OpenAI__ApiKey=${OPENAI_API_KEY}
      - NewsApi__Key=${NEWSAPI_KEY}
      - ASPNETCORE_ENVIRONMENT=Production
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: